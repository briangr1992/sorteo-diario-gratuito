services:
  - type: web
    runtime: node
    name: sorteo-diario-gratuito
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sorteo-diario-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: GAM_NETWORK_CODE
        sync: false
      - key: GAM_AD_UNIT_SIDE
        sync: false
      - key: GAM_AD_UNIT_MOBILE
        sync: false
      - key: GAM_AD_UNIT_CONTENT
        sync: false
      - key: GAM_REQUIRE_CMP
        value: "true"
      - key: GAM_REVENUE_IMPORT_KEY
        generateValue: true

databases:
  - name: sorteo-diario-db
    databaseName: sorteo
    user: sorteo
    plan: free
