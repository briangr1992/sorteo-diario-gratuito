<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Results | Daily Draw</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f6fb;font:16px/1.55 system-ui,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.back{color:#ffd166;text-decoration:none}.brand{font-weight:800}.hero{text-align:center;margin:30px 0}.hero h1{font-size:clamp(30px,5vw,44px)}.muted,.note{color:#aab5c8}.results{display:grid;gap:12px}.result{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#111827;border:1px solid #29354a;border-radius:14px;padding:18px}.result h2{margin:0 0 3px;font-size:18px}.amount{font-size:22px;font-weight:800;color:#ffd166}.back{display:block;text-align:center;margin:28px}.note{text-align:center}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">✦ DAILY DRAW</a><nav><a href="Juegos.html">Games</a> · <a href="Chat.html">Chat</a></nav></header><section class="hero"><h1>🏆 Daily lottery results</h1><p class="muted">The latest completed draws.</p></section><section id="results" class="results" aria-live="polite"><p class="note">Loading results…</p></section><a class="back" href="index.html">← Back to the draw</a></main><script>
(async()=>{const root=document.getElementById('results');try{const r=await fetch('/api/results'),rows=await r.json();root.replaceChildren();if(!rows.length){root.innerHTML='<p class="note">No completed draws yet.</p>';return}for(const item of rows){const article=document.createElement('article');article.className='result';const left=document.createElement('div'),date=document.createElement('h2'),info=document.createElement('p'),amount=document.createElement('b');date.textContent=new Date(item.draw_date+'T00:00:00Z').toLocaleDateString(undefined,{dateStyle:'long',timeZone:'UTC'});info.className='muted';info.textContent=item.winner?`Winner: ${item.winner} · winning tickets: ${item.tickets}`:'No eligible tickets';amount.className='amount';amount.textContent='$'+Number(item.prize).toFixed(2);left.append(date,info);article.append(left,amount);root.append(article)}}catch{root.textContent='Could not load results right now.'}})();
</script><script src="/ads.js" defer></script></body></html>
