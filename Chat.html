<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Community chat | Daily Draw</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f6fb;font:16px/1.55 system-ui,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.back{color:#ffd166;text-decoration:none}.brand{font-weight:800}.hero{text-align:center;margin:25px 0}.card{background:#111827;border:1px solid #29354a;border-radius:16px;padding:18px}.feed{height:min(60vh,600px);min-height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:#090d18;border:1px solid #29354a;border-radius:12px}.message{max-width:90%;align-self:flex-start;background:#18243a;border-radius:12px;padding:9px 12px}.message.mine{align-self:flex-end;background:#263653}.meta{display:flex;justify-content:space-between;gap:14px;color:#aab5c8;font-size:12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}.report{border:0;background:none;color:#aab5c8;text-decoration:underline;cursor:pointer;font-size:12px;padding:0}.form{display:flex;gap:8px;margin-top:12px}.form input{flex:1;min-width:0;background:#090d18;color:#fff;border:1px solid #29354a;border-radius:9px;padding:12px;font:inherit}.button{background:#ffd166;color:#111;border:0;border-radius:9px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.status{min-height:24px;color:#aab5c8}.back{display:block;text-align:center;margin:24px}.fine{color:#aab5c8;font-size:13px}
@media(max-width:500px){.wrap{padding:12px}.form{flex-direction:column}.form .button{min-height:44px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">✦ DAILY DRAW</a><nav><a href="Juegos.html">Games</a> · <a href="Results.html">Results</a></nav></header><section class="hero"><h1>💬 Community chat</h1><p class="fine">Be kind. Messages are public to signed-in members. Report anything abusive.</p></section><section class="card"><div class="feed" id="feed" aria-live="polite"><p class="fine">Sign in to read the community chat.</p></div><form class="form" id="form"><input id="message" maxlength="500" placeholder="Write a message…" autocomplete="off"><button class="button" type="submit">Send</button></form><p id="status" class="status" aria-live="polite"></p></section><a class="back" href="index.html">← Home</a></main><script>
(()=>{const $=id=>document.getElementById(id),feed=$('feed');let csrf='';async function token(){if(!csrf)csrf=(await fetch('/api/csrf',{credentials:'same-origin'}).then(r=>r.json())).csrfToken;return csrf}function show(rows){const last=feed.scrollHeight-feed.scrollTop-feed.clientHeight<80;const fragment=document.createDocumentFragment();for(const row of rows){const article=document.createElement('article');article.className='message';article.dataset.id=row.id;if(row.mine)article.classList.add('mine');const meta=document.createElement('div'),name=document.createElement('b'),time=document.createElement('time'),report=document.createElement('button'),body=document.createElement('p');meta.className='meta';name.textContent=row.display_name;time.textContent=new Date(row.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});report.className='report';report.type='button';report.textContent='Report';report.dataset.report=row.id;body.className='body';body.textContent=row.body;meta.append(name,time,report);article.append(meta,body);fragment.append(article)}feed.replaceChildren(fragment);if(last)feed.scrollTop=feed.scrollHeight}async function load(){try{const response=await fetch('/api/chat/messages',{credentials:'same-origin'});if(response.status===401){$('status').textContent='Sign in from the home page to read and send messages.';return}if(!response.ok)throw new Error();show(await response.json())}catch{$('status').textContent='Could not load chat. Please sign in.'}}$('form').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message)return;try{const response=await fetch('/api/chat/messages',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':await token()},body:JSON.stringify({message})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Sign in with a verified account to post.');$('message').value='';$('status').textContent='';await load()}catch(error){$('status').textContent=error.message}};feed.onclick=async e=>{const button=e.target.closest('[data-report]');if(!button)return;try{const response=await fetch(`/api/chat/messages/${button.dataset.report}/report`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':await token()},body:'{}'});if(!response.ok)throw new Error();button.disabled=true;button.textContent='Reported'}catch{$('status').textContent='Could not submit report.'}};load();setInterval(load,5000)})();
</script><script src="/ads.js" defer></script></body></html>
