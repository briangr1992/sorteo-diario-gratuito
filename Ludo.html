<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Ludo vs bot | Daily Draw</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f6fb;font:16px/1.5 system-ui,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.top a,.back{color:#ffd166;text-decoration:none}.panel{margin:20px 0;padding:18px;background:#111827;border:1px solid #29354a;border-radius:16px;text-align:center}.board{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin:16px auto;width:min(94vw,600px);aspect-ratio:1;background:#09111d;padding:5px;border-radius:10px}.space{border:1px solid #34435b;border-radius:6px;background:#18243a;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;min-width:0;min-height:0;font-size:clamp(12px,3vw,22px)}.space.safe{background:#263957}.token{width:46%;height:46%;display:grid;place-items:center;border-radius:50%;color:#111;font-size:clamp(9px,2vw,14px);font-weight:900}.blue{background:#ffd166}.red{background:#f06b76}.home{color:#aab5c8;font-size:clamp(8px,2vw,13px)}.status{min-height:26px;color:#aab5c8}.dice{font-size:48px;color:#ffd166}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.button{border:1px solid #29354a;border-radius:9px;padding:10px 13px;background:#17243a;color:white;font:inherit;cursor:pointer}.primary{background:#ffd166;color:#111;font-weight:800}.button:disabled{opacity:.4}.tokens{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.back{display:block;text-align:center;margin:20px}.note{font-size:13px;color:#aab5c8}
</style></head><body><main class="wrap"><header class="top"><a href="index.html">✦ DAILY DRAW</a><a href="Juegos.html">← Games</a></header><section class="panel"><h1>🎲 Ludo vs bot</h1><p class="note">A quick simplified race: roll a six to leave base, race around the track, and land exactly home. Capture an opponent token to send it back to base.</p><div class="board" id="board" aria-label="Ludo board"></div><div class="dice" id="dice">–</div><p class="status" id="status" aria-live="polite">Start a game.</p><div class="controls"><button class="button primary" id="start">New game</button><button class="button" id="roll" disabled>Roll die</button></div><h3>Your tokens</h3><div class="tokens" id="tokens"></div><p class="note">Local game vs bot. No game-win points are issued yet.</p></section><a class="back" href="Juegos.html">← Back to games</a></main><script>
(()=>{const $=id=>document.getElementById(id),coords=[];for(let x=0;x<10;x++)coords.push([x,0]);for(let y=0;y<10;y++)coords.push([10,y]);for(let x=10;x>0;x--)coords.push([x,10]);for(let y=10;y>0;y--)coords.push([0,y]);const spaces=[];coords.forEach(([x,y],i)=>{const e=document.createElement('div');e.className='space'+([0,10,20,30].includes(i)?' safe':'');e.style.gridColumn=String(x+1);e.style.gridRow=String(y+1);e.dataset.index=i;$('board').append(e);spaces.push(e)});let you=[],bot=[],turn='you',rolled=0,active=false,chain=0;function render(){for(const e of spaces)e.replaceChildren();for(const [team,pieces,offset] of [['you',you,0],['bot',bot,20]])pieces.forEach((step,n)=>{const el=document.createElement('span');if(step<0){el.className='home';el.textContent=(team==='you'?'🔵':'🔴')+(n+1);const side=team==='you'?spaces[0]:spaces[20];side.append(el)}else if(step>=40){el.className='home';el.textContent=team==='you'?'🏁':'🏁';(team==='you'?spaces[9]:spaces[29]).append(el)}else{el.className='token '+(team==='you'?'blue':'red');el.textContent=String(n+1);spaces[(step+offset)%40].append(el)}});$('tokens').replaceChildren();you.forEach((step,i)=>{const b=document.createElement('button');b.className='button';b.textContent=step<0?`Token ${i+1} · base`:step>=40?`Token ${i+1} · home`:`Move token ${i+1}`;const legal=active&&turn==='you'&&rolled>0&&((step<0&&rolled===6)||(step>=0&&step<40&&step+rolled<=40));b.disabled=!legal;b.onclick=()=>move('you',i);$('tokens').append(b)});$('roll').disabled=!active||turn!=='you'||rolled>0}
function legalMoves(pieces,n){return pieces.map((step,i)=>({step,i})).filter(x=>x.step<0?n===6:x.step<40&&x.step+n<=40)}function move(team,index){const pieces=team==='you'?you:bot,offset=team==='you'?0:20,old=pieces[index],wasCapture=false;if(old<0)pieces[index]=0;else pieces[index]=old+rolled;const pos=pieces[index];let capture=false;if(pos<40&&!([0,10,20,30].includes((pos+offset)%40))){bot.forEach((b,i)=>{if(b>=0&&b<40&&(b+20)%40===(pos+offset)%40){bot[i]=-1;capture=true}});you.forEach((a,i)=>{if(team==='bot'&&a>=0&&a<40&&(a)%40===(pos+offset)%40){you[i]=-1;capture=true}})}const six=rolled===6;rolled=0;render();if(you.every(s=>s>=40)||bot.every(s=>s>=40)){active=false;$('status').textContent=you.every(s=>s>=40)?'You win!':'The bot wins.';render();return}if(team==='you'&&(six||capture)){turn='you';$('status').textContent=capture?'Capture! Roll again.':six?'Six! Roll again.':'Your turn.'}else if(team==='you'){turn='bot';$('status').textContent='Bot is rolling…';setTimeout(botTurn,650)}else if(six&&chain<2){chain++;turn='bot';$('status').textContent='Bot rolled a six and goes again…';setTimeout(botTurn,650)}else{chain=0;turn='you';$('status').textContent=capture?'Bot captured a token. Your turn.':'Your turn.'}render()}
function botTurn(){if(!active)return;const n=1+Math.floor(Math.random()*6);rolled=n;$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][n-1];const choices=legalMoves(bot,n);if(!choices.length){rolled=0;if(n===6&&chain<2){chain++;setTimeout(botTurn,500)}else{chain=0;turn='you';$('status').textContent='Your turn.'}render();return}const chosen=choices.sort((a,b)=>((a.step<0?0:a.step)-(b.step<0?0:b.step)))[Math.floor(Math.random()*choices.length)];setTimeout(()=>move('bot',chosen.i),500)}$('roll').onclick=()=>{if(!active||turn!=='you'||rolled)return;rolled=1+Math.floor(Math.random()*6);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][rolled-1];const options=legalMoves(you,rolled);if(!options.length){const wasSix=rolled===6;rolled=0;if(wasSix){$('status').textContent='Six, but no legal move. Roll again.'}else{turn='bot';$('status').textContent='No legal move. Bot turn.';setTimeout(botTurn,650)}}else if(options.length===1)move('you',options[0].i);else{$('status').textContent='Choose a token to move.';render()}render()};$('start').onclick=()=>{you=[-1,-1,-1,-1];bot=[-1,-1,-1,-1];turn='you';rolled=0;active=true;chain=0;$('dice').textContent='–';$('status').textContent='Roll a six to bring a token out.';render()};render()})();
</script><script src="/ads.js" defer></script></body></html>
